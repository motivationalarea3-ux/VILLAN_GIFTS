  body:before{

  .wrap{width:min(680px,100%);margin:auto;padding:48px 18px 34px;position:relative;z-index:2}

    border-radius:999px;background:rgba(0,229,255,.06);color:#b9f7ff;font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase
  }
  .brand h1{
    margin-top:18px;font-size:clamp(42px,12vw,74px);line-height:.9;font-weight:1000;letter-spacing:5px;
    background:linear-gradient(100deg,#fff 10%,#00e5ff 42%,#8b5cf6 72%,#ff2d8d);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(0,229,255,.12));
  }
  .brand p{margin-top:15px;color:var(--muted);font-size:15px}
  .register{
    display:flex;justify-content:center;align-items:center;gap:10px;width:100%;margin:34px 0 24px;padding:17px 20px;

  .card{
    position:relative;overflow:hidden;margin:13px 0;padding:18px;border:1px solid var(--line);border-radius:24px;
    background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025)),var(--panel);
    backdrop-filter:blur(18px);box-shadow:0 18px 45px rgba(0,0,0,.28);
    animation:rise .7s ease both
  }
  .card:nth-of-type(2){animation-delay:.1s}.card:nth-of-type(3){animation-delay:.2s}.card:nth-of-type(4){animation-delay:.3s}
  .card:after{content:"";position:absolute;width:120px;height:120px;right:-65px;top:-65px;border-radius:50%;background:var(--glow);filter:blur(2px);opacity:.14}
  .amount{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:950}
  .gift{font-size:27px}
  .code-row{display:flex;gap:9px;margin-top:15px}
  .code{
    flex:1;min-width:0;padding:14px 13px;border-radius:15px;border:1px solid rgba(255,255,255,.06);
    background:rgba(0,0,0,.30);color:#eef1ff;font:700 12px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
  }
  button{
    border:0;border-radius:15px;padding:0 18px;min-width:82px;background:linear-gradient(135deg,#8b5cf6,#b56cff);
    color:#fff;font-weight:900;cursor:pointer;transition:.2s transform,.2s filter
  }
  button:hover{transform:translateY(-2px);filter:brightness(1.1)}
  button.copied{background:linear-gradient(135deg,#00c98d,#18e7b0)}
  .note{text-align:center;color:#777d92;font-size:11px;line-height:1.5;margin:18px 10px 0}
  footer{text-align:center;color:#656b7d;font-size:12px;margin-top:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,.07)}
  .toast{
    position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    padding:11px 15px;border-radius:999px;background:#161925;border:1px solid rgba(255,255,255,.12);
    box-shadow:0 12px 30px #0008;color:#fff;font-size:12px;font-weight:800;z-index:20;transition:.25s
  }

<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<main class="wrap">
  <header class="brand">
    <span class="badge">⚡ Official Gift Zone</span>
    <h1>VILLAN BHAI</h1>
    <p>Exclusive Gift Codes • Fresh codes generated on every visit</p>
  </header>

  <a class="register" href="https://dhw540.com/register?inviteCode=JTHYNQN&from=web" target="_blank" rel="noopener noreferrer" id="registerNow">
    🚀 <span>REGISTER NOW</span> ↗
  </a>

  <div class="section-title">
    <strong>Today's Gift Codes</strong>
    <span class="live"><i></i> LIVE</span>
  </div>

  <section id="codes"></section>

  <footer>© 2026 VILLAN BHAI • Exclusive Gift Zone</footer>
</main>

<div class="toast" id="toast">Code copied ✓</div>

<script>
const amounts = [50,150,400];

function randomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const bytes = new Uint32Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, n => chars[n % chars.length]).join('');
}

const box = document.getElementById('codes');

amounts.forEach((amount, index) => {
  const card = document.createElement('article');
  card.className = 'card';
  card.style.setProperty('--glow', ['#00e5ff','#8b5cf6','#ff2d8d'][index]);
  const code = randomCode();
  card.innerHTML = `
    <div class="amount"><span class="gift">🎁</span> ₹${amount} GIFT CODE</div>
    <div class="code-row">
      <div class="code">${code}</div>
      <button type="button" aria-label="Copy ₹${amount} gift code">COPY</button>
    </div>`;
  const btn = card.querySelector('button');
  btn.addEventListener('click', async () => {
    try{
      await navigator.clipboard.writeText(code);
      btn.textContent = 'COPIED ✓';
      btn.classList.add('copied');
      showToast('Gift code copied ✓');
      setTimeout(()=>{btn.textContent='COPY';btn.classList.remove('copied')},1500);
    }catch(e){
      showToast('Long-press the code to copy');
    }
  });
  box.appendChild(card);
});

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

document.getElementById('registerNow').addEventListener('click', () => {
  if (typeof fbq === 'function') {
    fbq('track', 'Lead');
    fbq('track', 'Subscribe');
  }
});
</script>
